spring.application.name=hello-app
server.port=8080

# Version shown on "/" - comes from the APP_VERSION env var, "dev" if not set
app.version=${APP_VERSION:dev}

# Health endpoints for Kubernetes:
#   /actuator/health/liveness   -> livenessProbe
#   /actuator/health/readiness  -> readinessProbe
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Finish in-flight requests before the pod stops
server.shutdown=graceful
