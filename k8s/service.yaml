apiVersion: v1
kind: Service
metadata:
  name: hello-app
  namespace: demo
spec:
  type: NodePort
  selector:
    app: hello-app
  ports:
    - port: 80          # inside the cluster: http://hello-app.demo
      targetPort: 8080  # container port
      nodePort: 30080   # from outside: http://<node-ip>:30080
